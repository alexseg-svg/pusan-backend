  <style>

      color: #ffffff;
      text-shadow:

  <!-- Хедер с розово-фиолетовым неоном -->

  </nav>

  <!-- Список блюд -->
  <main class="max-w-md mx-auto px-4 mt-4 space-y-3.5" id="menu-list"></main>

  <!-- Нижняя панель Корзины -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 p-3 bg-zinc-950/95 backdrop-blur-lg border-t border-purple-950/50 z-40 transition-transform duration-300 translate-y-full">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div>
        <div class="text-[11px] text-zinc-400">Итого к заказу:</div>
        <div class="text-xl font-black text-fuchsia-400" id="cart-total">0 ₽</div>
      </div>
      <button onclick="openCheckoutModal()" class="flex-1 bg-gradient-to-r from-purple-600 via-fuchsia-600 to-pink-600 hover:opacity-90 active:scale-95 transition-all text-white font-bold py-3.5 px-5 rounded-xl shadow-[0_0_20px_rgba(217,70,239,0.35)] flex items-center justify-center gap-2">
        <span>Оформить заказ</span>
        <span id="cart-badge" class="bg-white/20 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: Оформление заказа -->
  <div id="checkout-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-zinc-900 border border-purple-900/40 rounded-t-3xl sm:rounded-2xl max-w-md w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h3 class="text-lg font-black text-white">Оформление заказа</h3>
        <button onclick="closeCheckoutModal()" class="text-zinc-400 hover:text-white text-xl p-1">&times;</button>
      </div>

      <div class="grid grid-cols-2 gap-2 bg-zinc-950 p-1 rounded-xl border border-zinc-800 text-xs font-semibold">
        <button id="type-dinein" onclick="setOrderType('dine_in')" class="py-2.5 rounded-lg bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white transition-all shadow-md">В заведении</button>
        <button id="type-takeaway" onclick="setOrderType('takeaway')" class="py-2.5 rounded-lg text-zinc-400 transition-all">Навынос</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Ваше имя *</label>
          <input id="cust-name" type="text" placeholder="Иван" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm focus:border-fuchsia-500 outline-none text-white">
        </div>
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Телефон для связи *</label>
          <input id="cust-phone" type="tel" placeholder="+7 (999) 000-00-00" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm focus:border-fuchsia-500 outline-none text-white">
        </div>
        <div id="table-field">
          <label class="text-xs text-zinc-400 block mb-1">Номер столика *</label>
          <input id="cust-table" type="text" placeholder="Например: 4" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm focus:border-fuchsia-500 outline-none text-white">
        </div>
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Пожелания к заказу</label>
          <input id="cust-comment" type="text" placeholder="Без васаби, приборы на 2 персоны..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm focus:border-fuchsia-500 outline-none text-white">
        </div>
      </div>

      <div class="pt-2">
        <button onclick="submitOrder()" id="submit-btn" class="w-full bg-gradient-to-r from-purple-600 via-fuchsia-600 to-pink-600 hover:opacity-90 font-bold py-3.5 rounded-xl shadow-lg shadow-fuchsia-950/40 text-white">
          Подтвердить заказ
        </button>
      </div>
    </div>
  </div>

      { id: 116, category: "Роллы", name: "MIX ролл", price: 670, weight: "255 гр", desc: "Атлантический лосось, краб микс, сыр Креметте, огурец, масаго, рис, нори" },
      { id: 117, category: "Роллы", name: "Морской флот", price: 870, weight: "300 гр", desc: "Сочный тунец, нежнейший лосось, креветки, копченый угорь" },
      { id: 118, category: "Роллы", name: "Калифорния с угрем", price: 690, weight: "230 гр", desc: "Копченый угорь, сыр Креметте, огурец, масаго, рис, нори" },
      { id: 119, category: "Роллы", name: "Острый угорь", price: 690, weight: "230 гр", desc: "Копченый угорь, сыр Креметте, огурец, шрирача, рис, нори" },

      // Маки
      { id: 201, category: "Маки", name: "Маки с огурцом", price: 270, weight: "115 гр", desc: "Рис, нори, огурец, кунжут" },

      { id: 204, category: "Маки", name: "Маки с угрем", price: 320, weight: "130 гр", desc: "Угорь копченый, огурец, рис, нори" },

      // Горячие роллы
      { id: 301, category: "Горячие", name: "Горячий ролл с угрем", price: 670, weight: "260 гр", desc: "Копченый угорь, сыр Креметте, авокадо, рис, нори, панировка" },
      { id: 302, category: "Горячие", name: "Эби хот", price: 630, weight: "260 гр", desc: "Креветки, сыр Креметте, авокадо, рис, нори, панировка" },
      { id: 303, category: "Горячие", name: "Кани хот", price: 590, weight: "260 гр", desc: "Краб фарш, масаго, авокадо, рис, нори, панировка" },
      { id: 304, category: "Горячие", name: "Темпура лосось", price: 670, weight: "260 гр", desc: "Атлантический лосось, сыр Креметте, авокадо, панировка" },

      // Запеченные роллы
      { id: 401, category: "Запеченные", name: "Запеченный краб", price: 590, weight: "280 гр", desc: "Краб фарш, масаго, сыр Креметте, сырный соус" },
      { id: 402, category: "Запеченные", name: "Огайо", price: 600, weight: "280 гр", desc: "Краб фарш, масаго, сыр Креметте, сырный соус" },
      { id: 403, category: "Запеченные", name: "Чиз хот", price: 650, weight: "290 гр", desc: "Краб фарш, сыр Креметте, сыр чеддер, соус унаги, кунжут" },
      { id: 404, category: "Запеченные", name: "Запеченный угорь", price: 670, weight: "280 гр", desc: "Копченый угорь, авокадо, сыр Креметте, соус унаги, кунжут" },
      { id: 405, category: "Запеченные", name: "Запеченный чикен", price: 620, weight: "280 гр", desc: "Куриное мясо, авокадо, сыр Креметте, соус терияки" },
      { id: 406, category: "Запеченные", name: "Запеченный лосось", price: 670, weight: "280 гр", desc: "Атлантический лосось, огурец, спайс и сырный соус" },
      { id: 407, category: "Запеченные", name: "Запеченная креветка", price: 650, weight: "280 гр", desc: "Тигровые креветки, сыр Креметте, сырный соус" },

      // Гунканы и суши
      { id: 501, category: "Гунканы & Суши", name: "Гункан с креветкой", price: 210, weight: "35 гр", desc: "Креветка, рис, нори, спайс соус" },
      { id: 502, category: "Гунканы & Суши", name: "Гункан с лососем", price: 210, weight: "35 гр", desc: "Атлантический лосось, рис, спайс соус" },
      { id: 503, category: "Гунканы & Суши", name: "Гункан с тунцом", price: 210, weight: "35 гр", desc: "Тунец, рис, нори, спайс соус" },
      { id: 504, category: "Гунканы & Суши", name: "Гункан с угрем", price: 210, weight: "35 гр", desc: "Копченый угорь, рис, спайс соус" },
      { id: 505, category: "Гунканы & Суши", name: "Суши с креветкой", price: 190, weight: "30 гр", desc: "Креветка, рис" },
      { id: 506, category: "Гунканы & Суши", name: "Суши с лососем", price: 190, weight: "30 гр", desc: "Атлантический лосось, рис" },
      { id: 507, category: "Гунканы & Суши", name: "Суши с тунцом", price: 190, weight: "30 гр", desc: "Тунец, рис" },
      { id: 508, category: "Гунканы & Суши", name: "Суши с угрем", price: 190, weight: "30 гр", desc: "Копченый угорь, рис" }
    ];

    let cart = {};
    let activeCategory = "Все";
    let currentOrderType = "dine_in";

    function renderCategories() {
      const container = document.getElementById('category-bar');
      if (!container) return;
      const categories = ["Все", "Роллы", "Запеченные", "Горячие", "Маки", "Гунканы & Суши"];
      container.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${activeCategory === cat ? 'bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white shadow-[0_0_12px_rgba(217,70,239,0.35)]' : 'bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800'}">
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const container = document.getElementById('menu-list');
      if (!container) return;
      const filtered = activeCategory === "Все" ? MENU : MENU.filter(i => i.category === activeCategory);

      container.innerHTML = filtered.map(item => {
        const qty = cart[item.id] || 0;

        return `
          <div class="bg-zinc-900/90 border border-zinc-800/80 p-3 rounded-2xl flex gap-3 hover:border-purple-500/40 transition-all">
            <!-- БЛОК КАРТИНКИ: аккуратная темная заглушка -->
            <div class="relative w-24 h-24 shrink-0 rounded-xl overflow-hidden bg-zinc-950 border border-purple-950/60 flex items-center justify-center">
              <div class="flex flex-col items-center justify-center text-center p-1">
                <span class="text-2xl">🥢</span>
                <span class="text-[9px] font-black tracking-wider uppercase text-fuchsia-400/80 mt-1">Фото скоро</span>
              </div>
              <img src="/images/${item.id}.jpg" 
                   alt="${item.name}" 
                   class="absolute inset-0 w-full h-full object-cover z-10"
                   onload="this.style.display='block'"
                   onerror="this.style.display='none'"
                   style="display:none">
            </div>

            <!-- Инфо и кнопка «+» -->
            <div class="flex-1 flex flex-col justify-between py-0.5">
              <div>
                <div class="flex items-start justify-between gap-1">
                  <h4 class="font-bold text-sm text-zinc-100 leading-tight">${item.name}</h4>
                  <span class="text-[10px] text-zinc-500 font-medium shrink-0">${item.weight}</span>
                </div>
                <p class="text-[11px] text-zinc-400 line-clamp-2 mt-1 leading-snug">${item.desc}</p>
              </div>

              <div class="flex items-center justify-between mt-2 pt-1">
                <div class="text-fuchsia-400 font-black text-sm">${item.price} ₽</div>
                
                <div>
                  ${qty === 0 ? `
                    <button onclick="addToCart(${item.id})" class="bg-zinc-800 hover:bg-gradient-to-r hover:from-purple-600 hover:to-fuchsia-600 active:scale-90 text-zinc-200 hover:text-white w-8 h-8 rounded-xl flex items-center justify-center font-bold text-lg transition-all border border-zinc-700/60 shadow-sm">
                      +
                    </button>
                  ` : `
                    <div class="flex items-center bg-zinc-800 border border-fuchsia-500/50 rounded-xl p-0.5 shadow-[0_0_10px_rgba(217,70,239,0.25)]">
                      <button onclick="removeFromCart(${item.id})" class="w-7 h-7 rounded-lg flex items-center justify-center text-zinc-300 hover:text-white text-sm font-bold active:scale-90">−</button>
                      <span class="w-5 text-center text-xs font-bold text-fuchsia-400">${qty}</span>
                      <button onclick="addToCart(${item.id})" class="w-7 h-7 rounded-lg flex items-center justify-center text-zinc-300 hover:text-white text-sm font-bold active:scale-90">+</button>
                    </div>
                  `}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function addToCart(id) { cart[id] = (cart[id] || 0) + 1; updateUI(); }
    function removeFromCart(id) { if (cart[id] > 1) cart[id]--; else delete cart[id]; updateUI(); }

    function updateUI() {
      let total = 0, count = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = MENU.find(i => i.id == id);
        if (item) { total += item.price * qty; count += qty; }
      }
      document.getElementById('cart-total').innerText = `${total} ₽`;
      document.getElementById('cart-badge').innerText = count;

      const cartBar = document.getElementById('cart-bar');
      if (count > 0) cartBar.classList.remove('translate-y-full');
      else cartBar.classList.add('translate-y-full');

      renderMenu();
    }

    function setOrderType(type) {
      currentOrderType = type;
      const btnIn = document.getElementById('type-dinein');
      const btnTake = document.getElementById('type-takeaway');
      const tableField = document.getElementById('table-field');

      if (type === 'dine_in') {
        btnIn.className = 'py-2.5 rounded-lg bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white transition-all shadow-md';
        btnTake.className = 'py-2.5 rounded-lg text-zinc-400 transition-all';
        tableField.classList.remove('hidden');
      } else {
        btnTake.className = 'py-2.5 rounded-lg bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white transition-all shadow-md';
        btnIn.className = 'py-2.5 rounded-lg text-zinc-400 transition-all';
        tableField.classList.add('hidden');
      }
    }

    function openCheckoutModal() { document.getElementById('checkout-modal').classList.remove('hidden'); }
    function closeCheckoutModal() { document.getElementById('checkout-modal').classList.add('hidden'); }

    async function submitOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const table = document.getElementById('cust-table').value.trim();
      const comment = document.getElementById('cust-comment').value.trim();

      if (!name || !phone) return alert('Пожалуйста, укажите имя и телефон!');
      if (currentOrderType === 'dine_in' && !table) return alert('Пожалуйста, укажите номер столика!');

      const items = Object.entries(cart).map(([id, qty]) => {
        const product = MENU.find(p => p.id == id);
        return { name: product.name, price: product.price, quantity: qty };
      });

      const total = items.reduce((acc, i) => acc + (i.price * i.quantity), 0);
      const payload = {
        customer: { name, phone, table: currentOrderType === 'dine_in' ? table : 'Навынос' },
        orderType: currentOrderType,
        comment,
        items,
        total
      };

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Отправка...';

      try {
        const res = await fetch('/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('🍣 Спасибо! Заказ передан на кухню.');
          cart = {};
          updateUI();
          closeCheckoutModal();
          if (tg) tg.close();
        } else {
          alert('Ошибка отправки заказа');
        }
      } catch (err) {
        alert('Ошибка связи с сервером');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Подтвердить заказ';
      }
    }

    // ГАРАНТИРОВАННЫЙ ЗАПУСК ПОСЛЕ ПОЛНОЙ ГОТОВНОСТИ СТРАНИЦЫ
    window.addEventListener('DOMContentLoaded', () => {
      try {
        if (tg?.initDataUnsafe?.user?.first_name) {
          const nameInput = document.getElementById('cust-name');
          if (nameInput) nameInput.value = tg.initDataUnsafe.user.first_name;
        }
      } catch (e) {}
      renderCategories();
      renderMenu();
    });
  </script>
</body>
</html>
